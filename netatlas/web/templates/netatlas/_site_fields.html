{% load i18n %}{# Expects `name`, `customers` and optionally `selected_customer`. #}
<p><label>{% translate "Name" %} <input name="name" value="{{ name }}" required></label></p>
{% if customers %}
<p>
  <label>{% translate "Customer" %}
    <select name="customer_id">
      <option value="">{% translate "None" %}</option>
      {% for customer in customers %}
      <option value="{{ customer.id }}"{% if customer.id == selected_customer %} selected{% endif %}>{{ customer.name }}</option>
      {% endfor %}
    </select>
  </label>
</p>
{% endif %}
